<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORS Test</title>
  </head>
  <body>
    <h1>CORS Test Page</h1>
    <button onclick="testCORS()">Test CORS</button>
    <div id="result"></div>

    <script>
      async function testCORS() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "Testing CORS...";

        try {
          // Test the health endpoint
          const response = await fetch("http://localhost:3000/api/health", {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
            },
          });

          if (response.ok) {
            const data = await response.json();
            resultDiv.innerHTML = `
                        <h3>✅ CORS Test Successful!</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Response:</strong></p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p><strong>CORS Headers:</strong></p>
                        <ul>
                            <li>Access-Control-Allow-Origin: ${response.headers.get(
                              "Access-Control-Allow-Origin"
                            )}</li>
                            <li>Access-Control-Allow-Methods: ${response.headers.get(
                              "Access-Control-Allow-Methods"
                            )}</li>
                            <li>Access-Control-Allow-Headers: ${response.headers.get(
                              "Access-Control-Allow-Headers"
                            )}</li>
                        </ul>
                    `;
          } else {
            resultDiv.innerHTML = `<h3>❌ Request failed with status: ${response.status}</h3>`;
          }
        } catch (error) {
          resultDiv.innerHTML = `
                    <h3>❌ CORS Test Failed!</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>This usually means CORS is not properly configured.</p>
                `;
        }
      }

      // Also test OPTIONS preflight request
      async function testPreflight() {
        try {
          const response = await fetch("http://localhost:3000/api/health", {
            method: "OPTIONS",
          });
          console.log("OPTIONS request successful:", response.status);
        } catch (error) {
          console.error("OPTIONS request failed:", error);
        }
      }

      // Test preflight on page load
      testPreflight();
    </script>
  </body>
</html>
